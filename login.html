<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Ayşenur Askerli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-primary d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <h3 class="text-center fw-bold mb-4">Öğrenci Girişi</h3>
                    
                    <form id="loginForm" action="login-kontrol.php" method="POST" onsubmit="return validateLogin()">
                        <div class="mb-3">
                            <label class="form-label">E-posta (Örn: b2412100001@sakarya.edu.tr)</label>
                            <input type="text" name="email" id="email" class="form-control rounded-pill">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Şifre (Öğrenci No)</label>
                            <input type="password" name="sifre" id="sifre" class="form-control rounded-pill">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Giriş Yap</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function validateLogin() {
            const email = document.getElementById('email').value;
            const sifre = document.getElementById('sifre').value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "" || sifre === "") {
                alert("Kullanıcı adı ve şifre alanları boş bırakılamaz!"); 
                return false;
            }
            if (!emailRegex.test(email)) {
                alert("Lütfen geçerli bir e-posta formatı girin!"); 
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
